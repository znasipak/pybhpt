name: pybhpt-env

channels:
  - conda-forge

dependencies:
  - python >=3.12
  - gsl >= 2.7.1
  - liblapack
  - numpy >=2.0
  - scipy
  # build tools, needed for `pip install --no-build-isolation`
  - cmake
  - cython
  - scikit-build-core
  - setuptools-scm >=8
  - pandas
  - spherical
  - tqdm
  - matplotlib
  - jupyter
  - ipykernel
  - ipython
  - pytest
  - pytest-cov

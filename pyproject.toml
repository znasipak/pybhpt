[build-system]
requires = [
  "cython",
  # No ceiling: an old cap leaves new Pythons (e.g. 3.14) without numpy wheels, forcing
  # a source build of numpy. Extensions built against numpy 2.x headers run on older
  # numpy down to the headers' default target API (1.25 for numpy 2.5), which sits below
  # the runtime floor below.
  "numpy>=2.0",
  "scikit-build-core"
]
build-backend = "scikit_build_core.build"

[project]
name = "pybhpt"
version = "1.0.0"
description = "Black Hole Perturbation Theory and Self-Force Algorithms in Python"
authors = [
  { name = "Zach Nasipak", email = "znasipak@gmail.com" }
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Cython",
  "Programming Language :: C++",
  "Natural Language :: English"
]
requires-python = ">=3.12"
dependencies = [
  # Floor: first numpy with wheels for Python 3.12 (requires-python). No ceiling here;
  # numba (via `spherical` in the extended extra) carries its own numpy cap.
  "numpy>=1.26",
  "scipy"
]

[project.optional-dependencies]
testing = [
  "pytest",
  "pytest-cov"
]
dev = [
  "matplotlib",
  "jupyter",
  "ipython",
  "ipykernel"
]
extended = [
  "pandas",
  "spherical",
  "tqdm"
]

[project.urls]
Github = "https://github.com/znasipak/pybhpt"
"Bug Tracker" = "https://github.com/znasipak/pybhpt/issues"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
build.verbose = true

[tool.scikit-build.sdist]
include = [ "cpp/", "cython/", "CMakeLists.txt" ]
exclude = [ ".github/", "tutorial*", ".gitignore" ]

[tool.scikit-build.wheel]
packages = [ "pybhpt" ]

[tool.pytest.ini_options]
addopts = "--ignore=pybhpt/extern"
norecursedirs = ["extern"]
